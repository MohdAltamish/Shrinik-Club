<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shrinik Club | CSE Technical Club</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f1222 0%, #1a1040 55%, #0c1a3a 100%);
      color: #e6e8f2;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: clamp(2.2rem, 6vw, 4rem); letter-spacing: 6px; }
    .tagline { margin-top: 10px; font-size: 1.1rem; opacity: .75; }
    .hint { margin-top: 28px; font-size: .95rem; opacity: .55; max-width: 480px; line-height: 1.6; }
    .badge {
      display: inline-block; margin-bottom: 18px; padding: 6px 14px; border-radius: 999px;
      border: 1px solid rgba(139,147,184,.35); font-size: .8rem; letter-spacing: 2px; opacity: .8;
    }
  </style>
</head>
<body>
  <div>
    <span class="badge">GL BAJAJ · EST. 2021</span>
    <h1>SHRINIK</h1>
    <p class="tagline">Where Ideas Become Innovation.</p>
    <p class="hint">
      This is a demo page. The chat widget in the bottom-right corner is the embeddable
      assistant — copy the script tag below into your real website to install it.
    </p>
  </div>
  <script src="/widget.js" data-endpoint="/api/chat"></script>
</body>
</html>
